model_list:
  - model_name: helmflow-default
    litellm_params:
      # Oficjalny (rekomendowany przez MiniMax) endpoint zgodny z API Anthropic;
      # LiteLLM tłumaczy żądania OpenAI-format klientów na format Anthropic.
      model: anthropic/MiniMax-M3
      api_base: https://api.minimax.io/anthropic
      api_key: os.environ/MINIMAX_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
